name: Build Docker Image

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Build Docker image
      run: |
        docker build -t devops-app:${{ github.sha }} .
        docker images | grep devops-app
    
    - name: Test image
      run: |
        docker run -d -p 8080:8080 --name test-app devops-app:${{ github.sha }}
        sleep 2
        curl http://localhost:8080 || echo "Test failed"
        docker stop test-app
        docker rm test-app
